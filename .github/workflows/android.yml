name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Loģikas testi
        run: node android/test/logic.test.js

      - uses: gradle/actions/setup-gradle@v4

      - name: Paraksta atslēga
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_PW"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/ci.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=estudijas-ci" >> "$GITHUB_ENV"
          fi

      - name: Būvē APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/RTU-estudijas.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RTU-estudijas-apk
          path: ${{ runner.temp }}/RTU-estudijas.apk

      - name: Publicē Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android lietotne (jaunākā)"
          prerelease: false
          make_latest: true
          files: ${{ runner.temp }}/RTU-estudijas.apk
          body: |
            RTU estudijas — Android lietotne. Versija 1.0.${{ github.run_number }} (${{ github.sha }}).

            Instalēšana: lejupielādē **RTU-estudijas.apk** telefonā un atver to (atļauj instalēt no šī avota).
            Jaunāku versiju var instalēt virsū — dati saglabājas.
