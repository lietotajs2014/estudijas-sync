name: Android APK

on:
  push:
    branches: [main, dev]     # dev: APK tikai kā artifact (melnraksta "release" atjauno tikai main)
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Loģikas testi
        working-directory: android/test
        run: |
          npm ci --no-audit --no-fund
          node logic.test.js

      - uses: gradle/actions/setup-gradle@v5

      - name: Paraksta atslēga
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_PW"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/ci.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=estudijas-ci" >> "$GITHUB_ENV"
          fi

      - name: Būvē APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/RTU-estudijas.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: RTU-estudijas-apk
          path: ${{ runner.temp }}/RTU-estudijas.apk
          retention-days: 30

      # Nepublicēts (draft) būvējums: to redz tikai tie, kam ir piekļuve repozitorijam; nav "Release".
      - name: Saglabā melnrakstā
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=repos/$GITHUB_REPOSITORY/releases
          ID=$(gh api "$R" --jq '[.[] | select(.draft and .tag_name=="android-build")][0].id // empty')
          if [ -z "$ID" ]; then
            ID=$(gh api -X POST "$R" -f tag_name=android-build -f name="Android būvējums (nepublicēts)" -F draft=true \
                 -f body="Automātisks APK būvējums testēšanai. Nav publicēts." --jq .id)
          fi
          for a in $(gh api "$R/$ID/assets" --jq '.[].id'); do gh api -X DELETE "$R/assets/$a"; done
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$RUNNER_TEMP/RTU-estudijas.apk" \
            "https://uploads.github.com/$R/$ID/assets?name=RTU-estudijas.apk" > /dev/null
          echo "APK saglabāts melnrakstā $ID (versija 1.0.$GITHUB_RUN_NUMBER)"
