name: Server image

# main → ghcr.io/lietotajs2014/estudijas-sync:latest (oficiālā lapa)
# dev  → ghcr.io/lietotajs2014/estudijas-sync:dev    (testa versija)
on:
  push:
    branches: [main, dev]
    paths: ["estudijas_sync/**", "server/**", "Dockerfile", "requirements-server.txt", "tests/**",
            ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testi
        run: |
          pip install -r requirements-server.txt pytest httpx
          python -m pytest -q tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tagi
        id: tags
        # :latest / :dev + nemainīgs :sha-<7> katram būvējumam, lai var atgriezties pie iepriekšējās versijas
        run: |
          img=ghcr.io/${{ github.repository }}
          ch=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          echo "list=$img:$ch,$img:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
