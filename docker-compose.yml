# Palaišana uz servera (drauga dators):
#   cp .env.example .env   → aizpildi
#   docker compose --profile nginx up -d      (A ieraksts + nginx, vajag atvērtu 443 portu)
#   docker compose --profile tunnel up -d     (Cloudflare Tunnel, porti nav jāatver)
# Sīkāk: DEPLOY.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: estudijas
      POSTGRES_USER: estudijas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?iestati POSTGRES_PASSWORD .env failā}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]          # DB nav pieejama ne no interneta, ne no mājas tīkla
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudijas -d estudijas"]
      interval: 10s
      retries: 5

  web:
    image: ${IMAGE:-ghcr.io/lietotajs2014/estudijas-sync:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://estudijas:${POSTGRES_PASSWORD}@db:5432/estudijas
    volumes:
      - userdata:/data
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, edge]
    # Porti uz āru netiek atvērti — pie web tiek tikai caur nginx vai cloudflared.

  worker:
    image: ${IMAGE:-ghcr.io/lietotajs2014/estudijas-sync:latest}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "server.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://estudijas:${POSTGRES_PASSWORD}@db:5432/estudijas
    volumes:
      - userdata:/data
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, edge]    # edge = izeja uz internetu (estudijas.rtu.lv, Google API)
    healthcheck: { disable: true }

  # --- variants A: Cloudflare A ieraksts (Proxied) → nginx → web ---
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/estudijas.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web]
    networks: [edge]

  # --- variants B: Cloudflare Tunnel (bez portiem rūterī) ---
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # iestati .env failā (tikai tunnel variantam)
    depends_on: [web]
    networks: [edge]

  # Nakts DB rezerves kopija uz ./backups (glabā 14 dienas)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  pgdata:
  userdata:

networks:
  internal:
    internal: true    # bez interneta; te ir tikai DB un tie, kam to vajag
  edge:
